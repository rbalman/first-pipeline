name: Hello                   # label shown in the Actions tab
on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: echo "linting…"

  test:
    needs: lint            # runs only after lint succeeds
    runs-on: ubuntu-latest
    steps:
      - run: echo "testing…"

  deploy:
    needs: [lint, test]    # waits for BOTH to succeed
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploying…"
